server.port=8080
spring.application.name=CareConnect-PRMS

# ==============================================================================
# DATABASE CONFIGURATION
# ==============================================================================
# OPTION 1: H2 In-Memory Database (DEFAULT - Zero configuration required)
# Perfect for college presentations, viva, and quick testing without installing external DB servers.
# Access the web console at: http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:careconnect_db  |  Username: sa  |  Password: (leave blank)
# ==============================================================================
spring.datasource.url=jdbc:h2:mem:careconnect_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console Access
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

